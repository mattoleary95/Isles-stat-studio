<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Up The Turnpike · Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap">
<style>
/* One file, three views:
   qa.html            -> the overlay (OBS Browser Source, 1920x1080, transparent)
   qa.html?control    -> the control panel (OBS Custom Browser Dock)
   qa.html?preview    -> the overlay with a sample background (used inside the control panel) */
:root{
  --navy:#0A1E3D; --navy2:#11305E; --blue:#00539B; --orange:#F47D30; --white:#FFFFFF;
  --font:"Cairo","Segoe UI",system-ui,sans-serif;
  --bg:#0A1222; --panel:#111C30; --panel2:#18253D; --line:#25365A; --fg:#EAF0F8; --muted:#8E9DB8; --accent:#F47D30;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}

/* ---------- overlay ---------- */
body.overlay{background:transparent;width:1920px;height:1080px;overflow:hidden;font-family:var(--font)}
body.preview{background:#333 center/cover no-repeat}
.stage{position:absolute;inset:0;transform-origin:0 0}
.qcard{position:absolute;left:50%;bottom:var(--bottom,160px);width:var(--width,1400px);transform:translate(-50%,40px);opacity:0;
  transition:transform .55s cubic-bezier(.2,1.25,.35,1),opacity .35s ease;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45))}
.qcard.show{transform:translate(-50%,0);opacity:1}
.qcard.hide{transform:translate(-50%,40px);opacity:0;transition:transform .35s ease-in,opacity .3s ease-in}
.qbody{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:26px;padding:26px 40px 26px 30px;
  background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 70%,#1A3F78 100%);border-radius:14px;overflow:hidden}
.qbody::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--orange)}
.qbody::after{content:"";position:absolute;right:-60px;top:-40px;width:360px;height:260px;background:radial-gradient(closest-side,rgba(244,125,48,.18),transparent);pointer-events:none}
.qlogo{width:104px;height:104px;border-radius:50%;flex:none;background:center/contain no-repeat;margin-left:6px}
.qtag{position:absolute;left:44px;top:-24px;display:flex;align-items:center;gap:14px;z-index:2}
.qtag .lbl{background:var(--orange);color:#fff;font:900 26px/1 var(--font);letter-spacing:.08em;padding:12px 20px 12px;border-radius:8px;text-transform:uppercase;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.qtag .from{background:#fff;color:var(--navy);font:800 24px/1 var(--font);padding:12px 18px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.3);white-space:nowrap;max-width:900px;overflow:hidden;text-overflow:ellipsis}
.qtag .from small{color:var(--blue);font-weight:700;margin-left:8px;letter-spacing:.02em}
.qtext{color:#fff;font:700 46px/1.22 var(--font);margin:12px 0 0;overflow-wrap:break-word;text-wrap:balance}
.qcard.nologo .qbody{grid-template-columns:minmax(0,1fr)}
.qcard.nologo .qlogo{display:none}
.qcard.light .qbody{background:linear-gradient(100deg,#FFFFFF 0%,#EEF3FA 100%)}
.qcard.light .qtext{color:var(--navy)}
.qcard.light .qtag .from{background:var(--navy);color:#fff}
.qcard.light .qtag .from small{color:#9CC3F0}

/* ---------- control panel ---------- */
body.control{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding:12px}
.control h1{font:900 17px/1.1 var(--font);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.control h1 span{color:var(--accent)}
.control h2{font:800 12px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
button{font:700 13px/1 var(--font);border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:10px 12px;cursor:pointer}
button:hover{border-color:#4a618a}
button.go{background:var(--accent);border-color:var(--accent);color:#1F0D00;font-size:15px;padding:12px}
button.stop{background:#E8505B;border-color:#E8505B;color:#fff;font-size:15px;padding:12px}
button.small{padding:6px 9px;font-size:12px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#55627a;flex:none}
.dot.on{background:#2ECC71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.preview-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000}
.preview-wrap iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.queue{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.qi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.qi.live{border-color:var(--accent)}
.qi.done{opacity:.5}
.qi .t{font-size:13px;line-height:1.35;word-break:break-word}
.qi .m{font-size:11px;color:var(--muted);font-weight:700}
.qi .b{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="overlayRoot" hidden>
  <div class="stage" id="stage">
    <div class="qcard" id="qcard">
      <div class="qtag"><span class="lbl" id="oLabel">Listener Question</span><span class="from" id="oFrom" hidden></span></div>
      <div class="qbody"><div class="qlogo" id="oLogo"></div><p class="qtext" id="oText"></p></div>
    </div>
  </div>
</div>

<div id="controlRoot" hidden>
  <h1>Up The Turnpike <span>Q&amp;A</span></h1>
  <div class="box">
    <div class="status"><span class="dot" id="liveDot"></span><span id="liveText">Nothing on screen</span></div>
    <div class="preview-wrap" id="pw"><iframe id="pv" title="Overlay preview" tabindex="-1"></iframe></div>
  </div>
  <div class="box">
    <label class="f">Question (paste it here)<textarea id="cText" placeholder="Who's your pick for the Isles' MVP so far?"></textarea></label>
    <div class="row">
      <label class="f" style="flex:3">From<input type="text" id="cFrom" placeholder="@username or name" maxlength="60"></label>
      <label class="f" style="flex:2">Where<select id="cWhere">
        <option value="">(none)</option><option>YouTube</option><option>X</option><option>Instagram</option><option>TikTok</option><option>Patreon</option><option>Discord</option><option>Email</option><option>Voicemail</option><option>Live chat</option>
      </select></label>
    </div>
    <div class="row">
      <button class="go" id="bShow">Show on stream</button>
      <button class="stop" id="bHide">Hide</button>
    </div>
    <p class="hint">Ctrl+Enter shows it. Showing again while one is up swaps it with a quick slide.</p>
  </div>
  <div class="box">
    <div class="row" style="align-items:center"><h2>Question queue</h2><span class="hint" id="qCount" style="text-align:right"></span></div>
    <label class="f">Paste a batch (one question per paragraph, or one per line). "Name: question" fills in who it's from.
      <textarea id="cBatch" placeholder="Mike from Massapequa: Is Schaefer the best rookie D in the league?&#10;&#10;@isles_fan_22: Who's the 4th line center by Christmas?"></textarea></label>
    <div class="row"><button id="bAdd">Add to queue</button><button id="bNext">Show next</button><button id="bClear" class="small" style="flex:none">Clear answered</button></div>
    <div class="queue" id="queue"></div>
  </div>
  <div class="box">
    <details>
      <summary>Look &amp; position</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <label class="f">Label on the tag<input type="text" id="sLabel" maxlength="30"></label>
        <label class="f">Distance from the bottom: <span id="vBottom"></span><input type="range" id="sBottom" min="20" max="500" step="5"></label>
        <label class="f">Width: <span id="vWidth"></span><input type="range" id="sWidth" min="900" max="1840" step="10"></label>
        <label class="f">Biggest text size: <span id="vFont"></span><input type="range" id="sFont" min="32" max="64" step="1"></label>
        <label class="f">Style<select id="sTheme"><option value="dark">Navy</option><option value="light">White</option></select></label>
        <label class="check"><input type="checkbox" id="sLogo"> Show the Up The Turnpike logo</label>
        <label class="f">Hide automatically after (seconds, 0 = stay up)<input type="number" id="sAuto" min="0" max="300" step="5"></label>
        <button id="bReset" class="small">Reset look &amp; position</button>
      </div>
    </details>
  </div>
</div>

  $("overlayRoot").hidden=false; $("oLogo").style.backgroundImage=`url(${LOGO})`;
  if(mode==="preview"){ // a stand-in for the show so the layout can be judged in the dock
    document.body.style.background="linear-gradient(90deg,#2b3a2f 0 50%,#2a2f3d 50% 100%)";
    const fake=document.createElement("div"); fake.innerHTML=`<div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(90deg,#F47D30,#00539B);display:flex;align-items:center;justify-content:center;font:900 72px var(--font);color:#fff;letter-spacing:.04em">YOUR TITLE BAR</div>
      <div style="position:absolute;left:300px;top:170px;width:330px;height:420px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.12)"></div>
      <div style="position:absolute;right:300px;top:170px;width:330px;height:420px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.12)"></div>`;
    document.body.prepend(fake);
  }
  const card=$("qcard"); let cur={}, hideTimer=0, swapTimer=0;
  function fit(){ // shrink the text until it fits in 3 lines
    const el=$("oText"); let size=+cur.font||46; el.style.fontSize=size+"px";
    const maxH=()=>size*1.22*3+2;
    while(size>26&&el.scrollHeight>maxH()){ size-=2; el.style.fontSize=size+"px"; }
  }
  function paint(s){
    card.style.setProperty("--bottom",(+s.bottom||160)+"px"); card.style.setProperty("--width",(+s.width||1400)+"px");
    card.classList.toggle("light",s.theme==="light"); card.classList.toggle("nologo",!s.logo);
    $("oLabel").textContent=s.label||"Question";
    const from=String(s.from||"").trim(), where=String(s.where||"").trim();
    $("oFrom").hidden=!from&&!where;
    $("oFrom").innerHTML=""; if(from){ $("oFrom").append(document.createTextNode(from)); }
    if(where){ const sm=document.createElement("small"); sm.textContent=(from?"· ":"")+"via "+where; $("oFrom").append(sm); }
    $("oText").textContent=s.text||""; cur=s; fit();
  }
  function apply(s){
    clearTimeout(hideTimer);
    const was=cur.visible, changed=s.seq!==cur.seq;
    if(s.visible){
      if(was&&changed&&cur.text!==s.text){ // swap: slide out, then in with the new question
        card.classList.remove("show"); card.classList.add("hide"); clearTimeout(swapTimer);
        swapTimer=setTimeout(()=>{ paint(s); card.classList.remove("hide"); void card.offsetWidth; card.classList.add("show"); },360);
      } else { paint(s); card.classList.remove("hide"); void card.offsetWidth; card.classList.add("show"); }
      if(+s.auto>0) hideTimer=setTimeout(()=>{ card.classList.remove("show"); card.classList.add("hide"); },(+s.auto)*1000);
    } else { if(was) { card.classList.remove("show"); card.classList.add("hide"); } else paint(s); }
    cur=Object.assign({},s);
  }
  apply(readState());
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.type==="state") apply(Object.assign({},DEF,e.data.state)); };
  window.addEventListener("storage",e=>{ if(e.key===KEY) apply(readState()); });
  // fallback: check now and then in case messages between the dock and the source don't arrive
  setInterval(()=>{ const s=readState(); if(s.seq!==cur.seq||s.visible!==cur.visible) apply(s); },700);
  if(document.fonts) document.fonts.ready.then(()=>{ if(cur.visible) fit(); });
}

/* ================= control panel ================= */
if(mode==="control"){
  document.body.classList.add("control"); $("controlRoot").hidden=false;
  let S=readState(), Q=store.get(QKEY,[]);
  const pv=$("pv"); pv.src=location.pathname+"?preview";
  const sizePv=()=>{ const w=$("pw").clientWidth; pv.style.transform=`scale(${w/1920})`; }; new ResizeObserver(sizePv).observe($("pw")); sizePv();
  function publish(){ S.seq=(S.seq||0)+1; store.set(KEY,S); if(bc) bc.postMessage({type:"state",state:S}); syncStatus(); }
  function syncStatus(){ $("liveDot").classList.toggle("on",!!S.visible); $("liveText").textContent= S.visible? "ON SCREEN: "+(S.text.length>70? S.text.slice(0,70)+"…" : S.text) : "Nothing on screen"; renderQueue(); }
  function show(text,from,where,id){
    text=String(text||"").trim(); if(!text){ $("cText").focus(); return; }
    Object.assign(S,{text,from:String(from||"").trim(),where:where||"",visible:true,liveId:id||null});
    Q.forEach(q=>{ if(id&&q.id===id) q.done=true; }); store.set(QKEY,Q);
    publish();
  }
  $("bShow").onclick=()=>show($("cText").value,$("cFrom").value,$("cWhere").value,null);
  $("bHide").onclick=()=>{ S.visible=false; publish(); };
  $("cText").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $("bShow").click(); } });
  // queue
  const uid=()=>Math.random().toString(36).slice(2,9);
  function parseBatch(txt){
    const t=String(txt||"").replace(/\r/g,"").trim(); if(!t) return [];
    const blocks= /\n\s*\n/.test(t)? t.split(/\n\s*\n/) : t.split("\n");
    return blocks.map(b=>b.replace(/\s*\n\s*/g," ").trim()).filter(Boolean).map(b=>{
      const m=b.match(/^(@?[A-Za-z0-9_.']{2,30}(?: [A-Za-z][A-Za-z.']{0,20}){0,3}(?: from [A-Za-z .']{2,30})?)\s*[:–—]\s+(.{6,})$/);
      return m? {id:uid(),from:m[1].trim(),text:m[2].trim(),where:$("cWhere").value||"",done:false} : {id:uid(),from:"",text:b,where:$("cWhere").value||"",done:false};
    });
  }
  $("bAdd").onclick=()=>{ const items=parseBatch($("cBatch").value); if(!items.length) return; Q.push(...items); store.set(QKEY,Q); $("cBatch").value=""; renderQueue(); };
  $("bNext").onclick=()=>{ const n=Q.find(q=>!q.done); if(n) show(n.text,n.from,n.where,n.id); };
  $("bClear").onclick=()=>{ Q=Q.filter(q=>!q.done); store.set(QKEY,Q); renderQueue(); };
  function renderQueue(){
    const box=$("queue"); box.innerHTML="";
    const left=Q.filter(q=>!q.done).length; $("qCount").textContent= Q.length? `${left} left of ${Q.length}` : "Empty";
    Q.forEach((q,i)=>{
      const d=document.createElement("div"); d.className="qi"+(q.done?" done":"")+(S.visible&&S.liveId===q.id?" live":"");
      const t=document.createElement("div"); t.className="t"; t.textContent=q.text;
      const m=document.createElement("div"); m.className="m"; m.textContent=(q.from||"(no name)")+(q.where?" · "+q.where:"")+(S.visible&&S.liveId===q.id?" · ON SCREEN":q.done?" · answered":"");
      const b=document.createElement("div"); b.className="b";
      const mk=(label,fn,cls)=>{ const x=document.createElement("button"); x.className="small"+(cls?" "+cls:""); x.textContent=label; x.onclick=fn; b.appendChild(x); };
      mk("Show",()=>show(q.text,q.from,q.where,q.id));
      mk("Edit",()=>{ $("cText").value=q.text; $("cFrom").value=q.from; $("cWhere").value=q.where||""; $("cText").focus(); });
      mk("↑",()=>{ if(i>0){ [Q[i-1],Q[i]]=[Q[i],Q[i-1]]; store.set(QKEY,Q); renderQueue(); } });
      mk("✕",()=>{ Q.splice(i,1); store.set(QKEY,Q); renderQueue(); });
      d.append(t,m,b); box.appendChild(d); });
  }
  // look & position
  const setV=()=>{ $("vBottom").textContent=S.bottom+"px"; $("vWidth").textContent=S.width+"px"; $("vFont").textContent=S.font+"px"; };
  function loadSettings(){ $("sLabel").value=S.label; $("sBottom").value=S.bottom; $("sWidth").value=S.width; $("sFont").value=S.font; $("sTheme").value=S.theme; $("sLogo").checked=!!S.logo; $("sAuto").value=S.auto; setV(); }
  [["sLabel","label",v=>v],["sBottom","bottom",Number],["sWidth","width",Number],["sFont","font",Number],["sTheme","theme",v=>v],["sAuto","auto",v=>Math.max(0,+v||0)]].forEach(([id,k,conv])=>{
    $(id).addEventListener("input",e=>{ S[k]=conv(e.target.value); setV(); publish(); }); });
  $("sLogo").addEventListener("change",e=>{ S.logo=e.target.checked; publish(); });
  $("bReset").onclick=()=>{ ["label","bottom","width","font","theme","logo","auto"].forEach(k=>S[k]=DEF[k]); loadSettings(); publish(); };
  // stay in step if another copy of the panel changes things
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.type==="state"){ S=Object.assign({},DEF,e.data.state); loadSettings(); syncStatus(); } };
  window.addEventListener("storage",e=>{ if(e.key===KEY){ S=readState(); loadSettings(); syncStatus(); } if(e.key===QKEY){ Q=store.get(QKEY,[]); renderQueue(); } });
  loadSettings(); syncStatus();
}
})();
</script>
</body>
</html>
