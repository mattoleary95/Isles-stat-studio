<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Jets Voicemail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@500;600;700;800;900&display=swap">
<style>
/* One file, three views:
   jets-voicemail.html            -> the overlay (OBS Browser Source, 1920x1080, transparent)
   jets-voicemail.html?control    -> the control panel (OBS Custom Browser Dock)
   jets-voicemail.html?preview    -> the overlay over a stand-in background (used inside the control panel) */
:root{
  --green:#125740; --green2:#1B7A5C; --deep:#0A3326; --white:#FFFFFF; --ink:#08261C;
  --disp:"Bebas Neue","Archivo Narrow","Arial Narrow",sans-serif; --ui:"Archivo","Segoe UI",system-ui,sans-serif;
  --bg:#0E1311; --panel:#161C1A; --panel2:#1E2623; --line:#2A3531; --fg:#E8EEEB; --muted:#8B9A94; --accent:#35C08A; --accent-ink:#04140D;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}

/* ---------- overlay ---------- */
body.overlay{background:transparent;width:1920px;height:1080px;overflow:hidden;font-family:var(--ui)}
.stage{position:absolute;inset:0}
.vm{position:absolute;left:var(--left,50%);bottom:var(--bottom,160px);width:var(--width,1240px);transform:translate(-50%,40px);opacity:0;
  transition:transform .55s cubic-bezier(.2,1.25,.35,1),opacity .35s ease;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45))}
.vm.show{transform:translate(-50%,0);opacity:1}
.vm.hide{transform:translate(-50%,40px);opacity:0;transition:transform .35s ease-in,opacity .3s ease-in}
.vm-body{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:28px;padding:24px 40px 24px 26px;
  background:linear-gradient(100deg,var(--deep) 0%,var(--green) 62%,var(--green2) 100%);border-radius:14px;overflow:hidden}
.vm-body::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:#fff}
.vm-body::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.035) 0 2px,transparent 2px 38px);pointer-events:none}
.vm-logo{width:170px;height:148px;background:center/contain no-repeat;margin-left:6px;position:relative;z-index:1}
.vm-phone{position:relative;z-index:1;width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.vm-phone svg{width:52px;height:52px}
.vm-phone::before,.vm-phone::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.7);animation:ring 1.8s ease-out infinite}
.vm-phone::after{animation-delay:.9s}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.vm-main{position:relative;z-index:1;min-width:0;padding-right:80px}
.vm.nowave .vm-main{padding-right:0}
.vm-name{color:#fff;font:400 92px/.95 var(--disp);letter-spacing:.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vm-from{color:#CFEBDD;font:800 30px/1.1 var(--ui);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0;display:flex;align-items:center;gap:12px}
.vm-from .pin{width:22px;height:22px;flex:none}
.vm-topic{color:#fff;font:600 30px/1.25 var(--ui);margin:12px 0 0;padding-top:12px;border-top:2px solid rgba(255,255,255,.18)}
.vm-wave{position:absolute;right:34px;top:24px;display:flex;gap:6px;align-items:center;height:56px;z-index:1}
.vm-wave i{display:block;width:7px;border-radius:4px;background:rgba(255,255,255,.85);height:20%;animation:wave 1s ease-in-out infinite}
@keyframes wave{0%,100%{height:18%}50%{height:100%}}
.vm-tag{position:absolute;left:44px;top:-26px;display:flex;gap:12px;z-index:2}
.vm-tag .lbl{background:#fff;color:var(--green);font:400 34px/1 var(--disp);letter-spacing:.08em;padding:12px 18px 9px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px}
.vm-tag .lbl b{width:12px;height:12px;border-radius:50%;background:#E8202A;display:inline-block;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.vm.nologo .vm-logo{display:none}
.vm.nologo .vm-body{grid-template-columns:auto minmax(0,1fr)}
.vm.nophone .vm-phone{display:none}
.vm.nologo.nophone .vm-body{grid-template-columns:minmax(0,1fr)}
.vm.nowave .vm-wave{display:none}
.vm.light .vm-body{background:linear-gradient(100deg,#FFFFFF 0%,#EEF5F1 100%)}
.vm.light .vm-body::before{background:var(--green)}
.vm.light .vm-name{color:var(--green)}
.vm.light .vm-from{color:#3D6556}
.vm.light .vm-topic{color:var(--ink);border-top-color:rgba(18,87,64,.2)}
.vm.light .vm-wave i{background:var(--green)}
.vm.light .vm-phone{background:var(--green)}
.vm.light .vm-phone svg path{fill:#fff}
.vm.light .vm-phone::before,.vm.light .vm-phone::after{border-color:rgba(18,87,64,.6)}
.vm.light .vm-tag .lbl{background:var(--green);color:#fff}

/* ---------- control panel ---------- */
body.control{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);padding:12px}
.control h1{font:400 26px/1 var(--disp);letter-spacing:.04em;margin:0 0 10px}
.control h1 span{color:var(--accent)}
.control h2{font:800 12px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
button{font:700 13px/1 var(--ui);border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:10px 12px;cursor:pointer}
button:hover{border-color:#4a5a54}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:15px;padding:12px}
button.stop{background:#E86A70;border-color:#E86A70;color:#fff;font-size:15px;padding:12px}
button.small{padding:6px 9px;font-size:12px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#55627a;flex:none}
.dot.on{background:#2ECC71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.preview-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000}
.preview-wrap iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
.queue{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.qi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.qi.live{border-color:var(--accent)}
.qi.done{opacity:.5}
.qi .t{font-size:14px;font-weight:800}
.qi .m{font-size:12px;color:var(--muted)}
.qi .b{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="overlayRoot" hidden>
  <div class="stage">
    <div class="vm" id="vm">
      <div class="vm-tag"><span class="lbl"><b></b><span id="oLabel">Voicemail</span></span></div>
      <div class="vm-body">
        <div class="vm-logo" id="oLogo"></div>
        <div class="vm-phone"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#125740" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></div>
        <div class="vm-main">
          <p class="vm-name" id="oName"></p>
          <p class="vm-from" id="oFrom"><svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="oFromText"></span></p>
          <p class="vm-topic" id="oTopic"></p>
        </div>
        <div class="vm-wave" aria-hidden="true"><i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i><i style="animation-delay:.6s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.1s"></i></div>
      </div>
    </div>
  </div>
</div>

<div id="controlRoot" hidden>
  <h1>Jets <span>Voicemail</span> Line</h1>
  <div class="box">
    <div class="status"><span class="dot" id="liveDot"></span><span id="liveText">Nothing on screen</span></div>
    <div class="preview-wrap" id="pw"><iframe id="pv" title="Overlay preview" tabindex="-1"></iframe></div>
  </div>
  <div class="box">
    <label class="f">Caller's name<input type="text" id="cName" placeholder="Mike" maxlength="40"></label>
    <label class="f">Calling from<input type="text" id="cFrom" placeholder="Massapequa, NY" maxlength="60"></label>
    <label class="f">What it's about (optional, one line)<input type="text" id="cTopic" placeholder="Wants Garrett Wilson extended yesterday" maxlength="120"></label>
    <div class="row">
      <button class="go" id="bShow">Show on stream</button>
      <button class="stop" id="bHide">Hide</button>
    </div>
    <p class="hint">Enter in any box shows it. Showing a new caller while one is up swaps them with a quick slide.</p>
  </div>
  <div class="box">
    <div class="row" style="align-items:center"><h2>Tonight's voicemails</h2><span class="hint" id="qCount" style="text-align:right"></span></div>
    <label class="f">Paste the list, one caller per line: <b>Name, Town, ST - what it's about</b> (the part after the dash is optional)
      <textarea id="cBatch" placeholder="Mike, Massapequa, NY - Garrett Wilson extension&#10;Tina, Hoboken, NJ - Is the defense for real?&#10;Big Sal, Staten Island"></textarea></label>
    <div class="row"><button id="bAdd">Add to list</button><button id="bNext">Show next</button><button id="bClear" class="small" style="flex:none">Clear played</button></div>
    <div class="queue" id="queue"></div>
  </div>
  <div class="box">
    <details>
      <summary>Look &amp; position</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <label class="f">Label on the tag<input type="text" id="sLabel" maxlength="30"></label>
        <label class="f">Distance from the bottom: <span id="vBottom"></span><input type="range" id="sBottom" min="20" max="500" step="5"></label>
        <label class="f">Left / right position: <span id="vLeft"></span><input type="range" id="sLeft" min="25" max="75" step="1"></label>
        <label class="f">Width: <span id="vWidth"></span><input type="range" id="sWidth" min="800" max="1840" step="10"></label>
        <label class="f">Style<select id="sTheme"><option value="dark">Jets green</option><option value="light">White</option></select></label>
        <label class="check"><input type="checkbox" id="sLogo"> Show my logo</label>
        <label class="check"><input type="checkbox" id="sPhone"> Show the ringing phone</label>
        <label class="check"><input type="checkbox" id="sWave"> Show the moving sound bars</label>
        <label class="f">Hide automatically after (seconds, 0 = stay up)<input type="number" id="sAuto" min="0" max="600" step="5"></label>
        <button id="bReset" class="small">Reset look &amp; position</button>
      </div>
    </details>
  </div>
</div>

const KEY="jets-vm-state-v1", QKEY="jets-vm-queue-v1", CH="jets-vm";
const DEF={visible:false,seq:0,name:"",from:"",topic:"",liveId:null,label:"Voicemail",bottom:160,left:50,width:1240,theme:"dark",logo:true,phone:true,wave:true,auto:0};
const params=new URLSearchParams(location.search);
const mode= params.has("control")? "control" : params.has("preview")? "preview" : "overlay";
const $=id=>document.getElementById(id);
const store={ get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null? d : v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let bc=null; try{ bc=new BroadcastChannel(CH); }catch(e){}
const readState=()=>Object.assign({},DEF,store.get(KEY,{}));

/* ================= overlay ================= */
if(mode!=="control"){
  document.body.classList.add("overlay"); $("overlayRoot").hidden=false; $("oLogo").style.backgroundImage=`url(${LOGO})`;
  if(mode==="preview"){ // stand-in for the show so the layout can be judged in the dock
    document.body.style.background="linear-gradient(90deg,#2b3a2f 0 50%,#2a2f3d 50% 100%)";
    const fake=document.createElement("div"); fake.innerHTML=`<div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(90deg,#125740,#0A3326);display:flex;align-items:center;justify-content:center;font:400 84px var(--disp);color:#fff;letter-spacing:.04em">YOUR TITLE BAR</div>
      <div style="position:absolute;left:300px;top:170px;width:330px;height:420px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.12)"></div>
      <div style="position:absolute;right:300px;top:170px;width:330px;height:420px;border-radius:50% 50% 40% 40%;background:rgba(255,255,255,.12)"></div>`;
    document.body.prepend(fake);
  }
  const card=$("vm"); let cur={}, hideT=0, swapT=0;
  function fitName(){ const el=$("oName"); let size=92; el.style.fontSize=size+"px"; while(size>50&&el.scrollWidth>el.clientWidth){ size-=4; el.style.fontSize=size+"px"; } }
  function paint(s){
    card.style.setProperty("--bottom",(+s.bottom||160)+"px"); card.style.setProperty("--width",(+s.width||1240)+"px"); card.style.setProperty("--left",(+s.left||50)+"%");
    card.classList.toggle("light",s.theme==="light"); card.classList.toggle("nologo",!s.logo); card.classList.toggle("nophone",!s.phone); card.classList.toggle("nowave",!s.wave);
    $("oLabel").textContent=s.label||"Voicemail";
    $("oName").textContent=String(s.name||"").toUpperCase();
    $("oFromText").textContent=s.from? "Calling from "+s.from : ""; $("oFrom").hidden=!s.from;
    $("oTopic").textContent=s.topic||""; $("oTopic").hidden=!s.topic;
    cur=s; fitName();
  }
  function apply(s){
    clearTimeout(hideT);
    const was=cur.visible;
    if(s.visible){
      const newCaller= was&&s.seq!==cur.seq&&(s.name!==cur.name||s.from!==cur.from||s.topic!==cur.topic);
      if(newCaller){ card.classList.remove("show"); card.classList.add("hide"); clearTimeout(swapT);
        swapT=setTimeout(()=>{ paint(s); card.classList.remove("hide"); void card.offsetWidth; card.classList.add("show"); },360); }
      else { paint(s); card.classList.remove("hide"); void card.offsetWidth; card.classList.add("show"); }
      if(+s.auto>0) hideT=setTimeout(()=>{ card.classList.remove("show"); card.classList.add("hide"); },(+s.auto)*1000);
    } else { if(was){ card.classList.remove("show"); card.classList.add("hide"); } else paint(s); }
    cur=Object.assign({},s);
  }
  apply(readState());
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.type==="state") apply(Object.assign({},DEF,e.data.state)); };
  window.addEventListener("storage",e=>{ if(e.key===KEY) apply(readState()); });
  setInterval(()=>{ const s=readState(); if(s.seq!==cur.seq||s.visible!==cur.visible) apply(s); },700); // fallback if messages don't arrive
  if(document.fonts) document.fonts.ready.then(()=>{ if(cur.visible) fitName(); });
}

/* ================= control panel ================= */
if(mode==="control"){
  document.body.classList.add("control"); $("controlRoot").hidden=false;
  let S=readState(), Q=store.get(QKEY,[]);
  const pv=$("pv"); pv.src=location.pathname+"?preview";
  const sizePv=()=>{ pv.style.transform=`scale(${$("pw").clientWidth/1920})`; }; new ResizeObserver(sizePv).observe($("pw")); sizePv();
  function publish(){ S.seq=(S.seq||0)+1; store.set(KEY,S); if(bc) bc.postMessage({type:"state",state:S}); syncStatus(); }
  function syncStatus(){ $("liveDot").classList.toggle("on",!!S.visible); $("liveText").textContent= S.visible? "ON SCREEN: "+(S.name||"(no name)")+(S.from?" · "+S.from:"") : "Nothing on screen"; renderQueue(); }
  function show(name,from,topic,id){
    name=String(name||"").trim(); from=String(from||"").trim(); topic=String(topic||"").trim();
    if(!name&&!from){ $("cName").focus(); return; }
    Object.assign(S,{name,from,topic,visible:true,liveId:id||null});
    Q.forEach(q=>{ if(id&&q.id===id) q.done=true; }); store.set(QKEY,Q); publish();
  }
  $("bShow").onclick=()=>show($("cName").value,$("cFrom").value,$("cTopic").value,null);
  $("bHide").onclick=()=>{ S.visible=false; publish(); };
  ["cName","cFrom","cTopic"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("bShow").click(); } }));
  const uid=()=>Math.random().toString(36).slice(2,9);
  function parseBatch(txt){ // "Name, Town, ST - topic" (topic optional)
    return String(txt||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      let topic=""; const dash=l.search(/\s[-–—]\s/); if(dash>0){ topic=l.slice(dash).replace(/^\s[-–—]\s/,"").trim(); l=l.slice(0,dash).trim(); }
      const i=l.indexOf(","); const name= i<0? l : l.slice(0,i).trim(), from= i<0? "" : l.slice(i+1).trim();
      return {id:uid(),name,from,topic,done:false}; });
  }
  $("bAdd").onclick=()=>{ const items=parseBatch($("cBatch").value); if(!items.length) return; Q.push(...items); store.set(QKEY,Q); $("cBatch").value=""; renderQueue(); };
  $("bNext").onclick=()=>{ const n=Q.find(q=>!q.done); if(n) show(n.name,n.from,n.topic,n.id); };
  $("bClear").onclick=()=>{ Q=Q.filter(q=>!q.done); store.set(QKEY,Q); renderQueue(); };
  function renderQueue(){
    const box=$("queue"); box.innerHTML="";
    const left=Q.filter(q=>!q.done).length; $("qCount").textContent= Q.length? `${left} left of ${Q.length}` : "Empty";
    Q.forEach((q,i)=>{ const live=S.visible&&S.liveId===q.id;
      const d=document.createElement("div"); d.className="qi"+(q.done?" done":"")+(live?" live":"");
      const t=document.createElement("div"); t.className="t"; t.textContent=(q.name||"(no name)")+(q.from?" · "+q.from:"");
      const m=document.createElement("div"); m.className="m"; m.textContent=(q.topic||"")+(live?(q.topic?" · ":"")+"ON SCREEN":q.done?(q.topic?" · ":"")+"played":"");
      const b=document.createElement("div"); b.className="b";
      const mk=(label,fn)=>{ const x=document.createElement("button"); x.className="small"; x.textContent=label; x.onclick=fn; b.appendChild(x); };
      mk("Show",()=>show(q.name,q.from,q.topic,q.id));
      mk("Edit",()=>{ $("cName").value=q.name; $("cFrom").value=q.from; $("cTopic").value=q.topic||""; $("cName").focus(); });
      mk("↑",()=>{ if(i>0){ [Q[i-1],Q[i]]=[Q[i],Q[i-1]]; store.set(QKEY,Q); renderQueue(); } });
      mk("✕",()=>{ Q.splice(i,1); store.set(QKEY,Q); renderQueue(); });
      d.append(t); if(m.textContent) d.append(m); d.append(b); box.appendChild(d); });
  }
  const setV=()=>{ $("vBottom").textContent=S.bottom+"px"; $("vWidth").textContent=S.width+"px"; $("vLeft").textContent= +S.left===50? "centered" : (+S.left<50? "left of center" : "right of center"); };
  function loadSettings(){ $("sLabel").value=S.label; $("sBottom").value=S.bottom; $("sLeft").value=S.left; $("sWidth").value=S.width; $("sTheme").value=S.theme; $("sLogo").checked=!!S.logo; $("sPhone").checked=!!S.phone; $("sWave").checked=!!S.wave; $("sAuto").value=S.auto; setV(); }
  [["sLabel","label",v=>v],["sBottom","bottom",Number],["sLeft","left",Number],["sWidth","width",Number],["sTheme","theme",v=>v],["sAuto","auto",v=>Math.max(0,+v||0)]].forEach(([id,k,conv])=>{
    $(id).addEventListener("input",e=>{ S[k]=conv(e.target.value); setV(); publish(); }); });
  [["sLogo","logo"],["sPhone","phone"],["sWave","wave"]].forEach(([id,k])=>$(id).addEventListener("change",e=>{ S[k]=e.target.checked; publish(); }));
  $("bReset").onclick=()=>{ ["label","bottom","left","width","theme","logo","phone","wave","auto"].forEach(k=>S[k]=DEF[k]); loadSettings(); publish(); };
  if(bc) bc.onmessage=e=>{ if(e.data&&e.data.type==="state"){ S=Object.assign({},DEF,e.data.state); loadSettings(); syncStatus(); } };
  window.addEventListener("storage",e=>{ if(e.key===KEY){ S=readState(); loadSettings(); syncStatus(); } if(e.key===QKEY){ Q=store.get(QKEY,[]); renderQueue(); } });
  loadSettings(); syncStatus();
}
})();
</script>
